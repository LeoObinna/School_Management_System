name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Nuxt App (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sms_testing
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sms:sms_secret@localhost:5432/sms_testing
      SESSION_SECRET: ci-test-secret-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Nuxt prepare
        run: npx nuxt prepare

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build (Cloudflare Pages)
        run: npm run build
