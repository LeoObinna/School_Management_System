name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vue 3 / TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Laravel 12 / PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sms_testing
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo, pdo_pgsql, pgsql, mbstring, xml, bcmath, intl, gd, zip, opcache, redis
          coverage: xdebug
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Composer dependencies
        run: |
          if [ -f composer.json ]; then
            composer validate --strict
            composer install --no-interaction --prefer-dist
          else
            echo "No backend/composer.json — skipping backend."
            exit 0
          fi

      - name: Prepare environment
        if: hashFiles('backend/composer.json') != ''
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Migrate
        if: hashFiles('backend/composer.json') != ''
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sms_testing
          DB_USERNAME: sms
          DB_PASSWORD: sms_secret
        run: php artisan migrate --force

      - name: Tests
        if: hashFiles('backend/composer.json') != ''
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sms_testing
          DB_USERNAME: sms
          DB_PASSWORD: sms_secret
        run: vendor/bin/pest --coverage --min=50 || vendor/bin/phpunit
