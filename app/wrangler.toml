# ===========================================================================
# SMS — Cloudflare Workers deployment configuration.
#
# Deployment model: MANUAL Wrangler deploys from the local machine only.
# There is NO GitHub/GitLab integration, NO Workers Builds, NO CI deploy.
# GitHub is used for source control/version history alone.
#
#   npm run build                 # Nitro preset cloudflare-module
#   npx wrangler dev              # local Worker emulation (binds below)
#   npm run deploy:production     # build + wrangler deploy -e production
#
# The previous Cloudflare Pages config has been removed; the project deploys
# exclusively as a Workers + Static Assets bundle via the cloudflare-module
# Nitro preset.
# ===========================================================================

name = "sms"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# --- Workers Static Assets (Nuxt/Nitro build output) -----------------------
[assets]
directory = ".output/public"
binding = "ASSETS"

# --- Local development (`wrangler dev`, via `npm run cf:dev`) ---------------
# LOCAL MODE ONLY — never use `wrangler dev --remote` (it would hit real
# remote resources).
#
# D1 local emulation with ZERO cloud resources: `wrangler dev` creates a
# local SQLite file under .wrangler/state/v3/d1/ for the binding. The
# `database_id` is a non-functional placeholder (no remote D1 exists in
# local mode). Apply D1 migrations locally with:
#   npx wrangler d1 migrations apply DB --local
[[d1_databases]]
binding = "DB"
database_name = "sms-local"
database_id = "00000000-0000-0000-0000-000000000000"
# Drizzle-kit (SQLite dialect, see drizzle.config.ts) generates DDL here;
# wrangler is the single applier/tracker (decision D5):
#   npx drizzle-kit generate          # author new migrations
#   npm run db:d1:migrate             # apply locally (--local)
migrations_dir = "database/migrations"

# R2 is emulated on local disk by `wrangler dev` (state under .wrangler/);
# the bucket name only names the local simulation. Nothing is created or
# written remotely, and the bucket is never exposed publicly.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-local"

# KV is emulated locally by `wrangler dev` (state under .wrangler/).
# EDGE_KV backs the distributed login rate limiter and the server-side
# session revocation list (Phase 13). The id below only names the local
# simulation; the production environment supplies the real namespace id.
[[kv_namespaces]]
binding = "EDGE_KV"
id = "00000000000000000000000000000000"

# Cron Triggers (Phase 13). Every 5 minutes the Worker publishes
# announcements whose status is 'scheduled' and scheduled_for is due,
# reusing the normal queue-backed notification fan-out. Crons are
# inert under plain `nuxt dev`; `wrangler dev --test-scheduled` hits
# them locally via /__scheduled.
[triggers]
crons = ["*/5 * * * *"]

# ===========================================================================
# Production — deployed Worker name: sms-production
# Provision once:
#   wrangler d1 create sms-production
#   wrangler r2 bucket create sms-production
#   wrangler kv namespace create sms-edge-production
#   wrangler queues create sms-notifications-production
#   wrangler secret put SESSION_SECRET -e production
# ===========================================================================
[env.production]

# D1 production database. Replace the placeholder id with the value
# returned by `wrangler d1 create sms-production` before the first
# production deploy. Apply schema with:
#   wrangler d1 migrations apply DB -e production --remote
[[env.production.d1_databases]]
binding = "DB"
database_name = "sms-production"
database_id = "02e2d8c3-9446-4853-bfd6-13e223f594ab"
migrations_dir = "database/migrations"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-production"

# KV namespace sms-edge-production (provisioned 2026-09-24).
[[env.production.kv_namespaces]]
binding = "EDGE_KV"
id = "580f9b723e6142e5be850c302fe2611e"

[env.production.triggers]
crons = ["*/5 * * * *"]

# Queues (Phase 12 Part B). Announcement publish enqueues one
# `announcement.published` message; the Worker consumes it via Nitro's
# cloudflare:queue hook (server/plugins/cloudflare-queue.ts) and inserts
# per-recipient notification rows idempotently. Batching is small so
# fan-out latency stays low; a failed message is redelivered with
# backoff, and a malformed (poison) message is acked by the consumer.
# Provision once:
#   wrangler queues create sms-notifications-production
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "sms-notifications-local"

[[queues.consumers]]
queue = "sms-notifications-local"
max_batch_size = 10
max_batch_timeout = 5

[[env.production.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "sms-notifications-production"

[[env.production.queues.consumers]]
queue = "sms-notifications-production"
max_batch_size = 10
max_batch_timeout = 5
