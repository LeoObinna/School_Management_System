# ===========================================================================
# SMS — Cloudflare Workers deployment configuration.
#
# Deployment model: MANUAL Wrangler deploys from the local machine only.
# There is NO GitHub/GitLab integration, NO Workers Builds, NO CI deploy.
# GitHub is used for source control/version history alone.
#
#   npm run build                 # Nitro preset cloudflare-module
#   npx wrangler dev              # local Worker emulation (binds below)
#   npm run deploy:staging        # build + wrangler deploy -e staging
#   npm run deploy:production     # build + wrangler deploy -e production
#
# The previous Cloudflare Pages config is preserved in wrangler.pages.toml
# for reference/rollback and is not loaded by Wrangler.
# ===========================================================================

name = "sms"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# --- Workers Static Assets (Nuxt/Nitro build output) -----------------------
[assets]
directory = ".output/public"
binding = "ASSETS"

# --- Local development (`wrangler dev`, via `npm run cf:dev`) ---------------
# LOCAL MODE ONLY — never use `wrangler dev --remote` before production
# cutover (it would hit real remote resources).
#
# Hyperdrive local emulation with ZERO cloud resources: the binding is
# declared for local `wrangler dev` and `localConnectionString` points at
# the local Postgres.app database sms_dev. The `id` is a non-functional
# placeholder (no remote Hyperdrive exists); wrangler never calls the API
# for it in local mode. This top-level binding is NEVER deployed — every
# deploy targets a named environment below (-e staging|production), which
# supplies its own real Hyperdrive id. Do NOT run `wrangler deploy`
# without an environment.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000"
localConnectionString = "postgresql://mac:local@127.0.0.1:5432/sms_dev"

# R2 is emulated on local disk by `wrangler dev` (state under .wrangler/);
# the bucket name only names the local simulation. Nothing is created or
# written remotely, and the bucket is never exposed publicly.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-local"

# ===========================================================================
# Staging — deployed Worker name: sms-staging
# Provision once:
#   wrangler hyperdrive create sms-pg-staging --connection-string="$STAGING_DB_URL"
#   wrangler r2 bucket create sms-staging
#   wrangler secret put SESSION_SECRET -e staging
# ===========================================================================
[env.staging]

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_STAGING_HYPERDRIVE_ID"

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-staging"

# ===========================================================================
# Production — deployed Worker name: sms-production
# Provision once:
#   wrangler hyperdrive create sms-pg-production --connection-string="$PROD_DB_URL"
#   wrangler r2 bucket create sms-production
#   wrangler secret put SESSION_SECRET -e production
# ===========================================================================
[env.production]

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-production"

# Queues (producer + consumer) are intentionally absent until Phase 10.
# Cron Triggers / Durable Objects will be added here when their phases land.
