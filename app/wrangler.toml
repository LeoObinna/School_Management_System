# ===========================================================================
# SMS — Cloudflare Workers deployment configuration.
#
# Deployment model: MANUAL Wrangler deploys from the local machine only.
# There is NO GitHub/GitLab integration, NO Workers Builds, NO CI deploy.
# GitHub is used for source control/version history alone.
#
#   npm run build                 # Nitro preset cloudflare-module
#   npx wrangler dev              # local Worker emulation (binds below)
#   npm run deploy:staging        # build + wrangler deploy -e staging
#   npm run deploy:production     # build + wrangler deploy -e production
#
# The previous Cloudflare Pages config is preserved in wrangler.pages.toml
# for reference/rollback and is not loaded by Wrangler.
# ===========================================================================

name = "sms"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# --- Workers Static Assets (Nuxt/Nitro build output) -----------------------
[assets]
directory = ".output/public"
binding = "ASSETS"

# --- Local development (`wrangler dev`, via `npm run cf:dev`) ---------------
# LOCAL MODE ONLY — never use `wrangler dev --remote` before production
# cutover (it would hit real remote resources).
#
# Hyperdrive local emulation with ZERO cloud resources: the binding is
# declared for local `wrangler dev` and `localConnectionString` points at
# the local Postgres.app database sms_dev. The `id` is a non-functional
# placeholder (no remote Hyperdrive exists); wrangler never calls the API
# for it in local mode. This top-level binding is NEVER deployed — every
# deploy targets a named environment below (-e staging|production), which
# supplies its own real Hyperdrive id. Do NOT run `wrangler deploy`
# without an environment.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000"
localConnectionString = "postgresql://mac:local@127.0.0.1:5432/sms_dev"

# R2 is emulated on local disk by `wrangler dev` (state under .wrangler/);
# the bucket name only names the local simulation. Nothing is created or
# written remotely, and the bucket is never exposed publicly.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-local"

# KV is emulated locally by `wrangler dev` (state under .wrangler/).
# EDGE_KV backs the distributed login rate limiter and the server-side
# session revocation list (Phase 13). The id below only names the local
# simulation; named environments supply real namespace ids.
[[kv_namespaces]]
binding = "EDGE_KV"
id = "00000000000000000000000000000000"

# Cron Triggers (Phase 13). Every 5 minutes the Worker publishes
# announcements whose status is 'scheduled' and scheduled_for is due,
# reusing the normal queue-backed notification fan-out. Crons are
# inert under plain `nuxt dev`; `wrangler dev --test-scheduled` hits
# them locally via /__scheduled.
[triggers]
crons = ["*/5 * * * *"]

# ===========================================================================
# Staging — deployed Worker name: sms-staging
# Provision once:
#   wrangler hyperdrive create sms-pg-staging --connection-string="$STAGING_DB_URL"
#   wrangler r2 bucket create sms-staging
#   wrangler kv namespace create sms-edge-staging
#   wrangler secret put SESSION_SECRET -e staging
# ===========================================================================
[env.staging]

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
# sms-pg-staging -> Neon sms_staging direct host (ep-calm-shape-…,
# no -pooler), read caching disabled for read-after-write correctness.
id = "f9399aef36f14ea4b41a1a5052c70f87"

[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-staging"

# Paste the id returned by `wrangler kv namespace create sms-edge-staging`.
[[env.staging.kv_namespaces]]
binding = "EDGE_KV"
id = "4e6311207ab94649a6f08f00f572d14f"

[env.staging.triggers]
crons = ["*/5 * * * *"]

# ===========================================================================
# Production — deployed Worker name: sms-production
# Provision once:
#   wrangler hyperdrive create sms-pg-production --connection-string="$PROD_DB_URL"
#   wrangler r2 bucket create sms-production
#   wrangler kv namespace create sms-edge-production
#   wrangler secret put SESSION_SECRET -e production
# ===========================================================================
[env.production]

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-production"

# Paste the id returned by `wrangler kv namespace create sms-edge-production`.
[[env.production.kv_namespaces]]
binding = "EDGE_KV"
id = "REPLACE_WITH_PRODUCTION_EDGE_KV_ID"

[env.production.triggers]
crons = ["*/5 * * * *"]

# Queues (Phase 12 Part B). Announcement publish enqueues one
# `announcement.published` message; the Worker consumes it via Nitro's
# cloudflare:queue hook (server/plugins/cloudflare-queue.ts) and inserts
# per-recipient notification rows idempotently. Batching is small so
# fan-out latency stays low; a failed message is redelivered with
# backoff, and a malformed (poison) message is acked by the consumer.
# Provision once per environment:
#   wrangler queues create sms-notifications-staging
#   wrangler queues create sms-notifications-production
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "sms-notifications-local"

[[queues.consumers]]
queue = "sms-notifications-local"
max_batch_size = 10
max_batch_timeout = 5

[[env.staging.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "sms-notifications-staging"

[[env.staging.queues.consumers]]
queue = "sms-notifications-staging"
max_batch_size = 10
max_batch_timeout = 5

[[env.production.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "sms-notifications-production"

[[env.production.queues.consumers]]
queue = "sms-notifications-production"
max_batch_size = 10
max_batch_timeout = 5
