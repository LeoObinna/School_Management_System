# Cloudflare Workers / Pages configuration for the SMS Nuxt app.
# Deploy with: wrangler pages deploy dist --project-name=sms
# (After `npm run build` with the cloudflare-pages Nitro preset.)

name = "sms"
compatibility_date = "2025-07-15"

# Pages project (Nitro cloudflare-pages preset outputs to .output/public)
pages_build_output_dir = ".output/public"

# Environment variables are injected at runtime via Cloudflare Pages
# environment variables (or `--var` for local dev). Do NOT put secrets here.

# --- Bindings ---
# R2 bucket for file storage (photos, documents, assignments, receipts, etc.)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "sms-staging"

# Hyperdrive for PostgreSQL connection pooling from Workers
# Create with: wrangler hyperdrive create sms-pg --connection-string="$DATABASE_URL"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "replace-with-hyperdrive-id"

# Cloudflare Queues for background jobs (reports, emails, notifications)
[[queues.producers]]
binding = "QUEUE"
queue = "sms-jobs"

# --- Dev ---
# Local dev with `npx wrangler pages dev .output/public`
[env.dev.vars]
DATABASE_URL = "postgresql://sms:sms_secret@localhost:5432/sms"
R2_BUCKET = "sms-staging"

# --- Production (separate environment) ---
[env.production]
name = "sms-production"

[env.production.r2_buckets]
binding = "R2_BUCKET"
bucket_name = "sms-production"
